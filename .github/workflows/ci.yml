# Lint, typecheck, unit tests and the full e2e suite on every branch push and on PRs (D72).
# The e2e suite runs here on a clean ubuntu runner, so a local flake caused by memory
# pressure on the dev machine can be told apart from a real failure.
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# A push to a branch with an open PR fires both events: one group per branch, so the newer
# run cancels the older one instead of both running.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The lab route is built in, so the animatic specs run instead of skipping.
      NEXT_PUBLIC_ENABLE_LAB: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # CI uses Playwright's bundled Chromium (local runs use the installed Chrome, D12).
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Skips the download on a cache hit; the system packages are installed either way.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
