# Two jobs (D82):
#   checks: lint, typecheck and unit tests, on every push and PR (fast).
#   full:   production build, the review-leak scan and the full e2e suite, only on a manual run
#           (workflow_dispatch, triggered at milestones) and on PRs to main.
# The e2e suite runs on a clean ubuntu runner, so a local flake caused by memory pressure on the
# dev machine can be told apart from a real failure (D72).
name: CI

# Docs-only changes don't run CI (D75): docs/** and every .md are skipped, except the docs the
# unit tests read (`git grep -n readFileSync -- 'src/**/*.test.ts'`). `paths` with negations, not
# `paths-ignore`, because only `paths` can re-include a file: a later pattern wins.
# Keep both lists in step with the tests.
on:
  push:
    branches: ["**"]
    paths:
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/CONTENT_CHECKLIST.md" # src/messages/messages.test.ts
      - "docs/content/services-list.md" # src/content/content.test.ts
      - "docs/content/image-prompts.md" # src/content/content.test.ts
      - "docs/design/storyboards/layers.md" # src/content/scenes/images.test.ts
  pull_request:
    branches: [main]
    paths: # the same list
      - "**"
      - "!docs/**"
      - "!**/*.md"
      - "docs/CONTENT_CHECKLIST.md" # src/messages/messages.test.ts
      - "docs/content/services-list.md" # src/content/content.test.ts
      - "docs/content/image-prompts.md" # src/content/content.test.ts
      - "docs/design/storyboards/layers.md" # src/content/scenes/images.test.ts
  workflow_dispatch:

# One group per branch and event: a newer push cancels the older push run, but a push never
# cancels a manual full run (or the PR run) in progress.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

  full:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'pull_request'
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The lab route is built in, so the animatic specs run instead of skipping.
      NEXT_PUBLIC_ENABLE_LAB: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Next.js build cache
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-${{ hashFiles('src/**', 'public/**', 'next.config.ts') }}
          restore-keys: next-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-

      - name: Build
        run: npm run build

      # The production build carries no review-mode content (v1 plan, Task A1; D78).
      - name: No review content in production
        run: npm run check:no-review-leak

      # CI uses Playwright's bundled Chromium (local runs use the installed Chrome, D12).
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Playwright browser cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # Skips the download on a cache hit; the system packages are installed either way.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
